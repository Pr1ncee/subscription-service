name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen
      - run: make lint
      - run: make typecheck
      - name: Audit runtime dependencies for known CVEs
        run: uv export --frozen --no-dev --no-emit-project | uvx pip-audit==2.10.1 --strict --disable-pip -r /dev/stdin

  test:
    name: Tests (Postgres + RabbitMQ via testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Run all tests (e2e skips itself without a stack; coverage floor via fail_under)
        run: uv run pytest -m "slow or not slow" --cov --cov-report=xml --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml

  docker:
    name: Image build + compose smoke test
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: subscriptions-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the stack
        run: docker compose up -d --wait
        env:
          IMAGE: subscriptions-service:ci
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: End-to-end test
        run: uv run pytest -m e2e -v
        env:
          E2E_BASE_URL: http://localhost:8000
      - name: Show service logs
        if: failure()
        run: docker compose logs
        env:
          IMAGE: subscriptions-service:ci
      - name: Tear down
        if: always()
        run: docker compose down -v
        env:
          IMAGE: subscriptions-service:ci
